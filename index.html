<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Чертеж навеса</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 14px;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div id="info">
        <strong></strong><br>
        <br>
        <br>
        <em>Удерживайте для вращения</em>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 8;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(15, 15, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const lineMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 });
        const meshMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
        });

        function createEdgesMesh(geometry) {
            const edges = new THREE.EdgesGeometry(geometry, 20);
            const line = new THREE.LineSegments(edges, lineMat);
            const mesh = new THREE.Mesh(geometry, meshMat);
            mesh.add(line);
            return mesh;
        }

        function createTube(p1, p2, width) {
            const dist = p1.distanceTo(p2);
            if (dist < 0.001) return new THREE.Group();
            const geo = new THREE.BoxGeometry(width, dist, width);
            geo.translate(0, dist / 2, 0);
            const mesh = createEdgesMesh(geo);
            mesh.position.copy(p1);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
            return mesh;
        }

        const group = new THREE.Group();

        // Параметры навеса (комбинация спецификации PDF и геометрии 7700)
        const numTrusses = 6;
        const totalLength = 6.0;
        const roofLength = 6.6;
        const spacing = totalLength / (numTrusses - 1);

        const colW = 0.12;
        const tubeW = 0.04;

        // Геометрия фермы из чертежа 7700x1500 
        const halfWidth = 3.85; // 7700 / 2
        const ridgeY = 1.5; // Высота конька 1500
        const archPeakY = 0.77; // Подъем арки 770
        const strutX = 3.21; // 3850 - 640 = 3210 (координата вертикальной стойки)

        // Расчет дуги, проходящей через (0, 0.77) и (3.21, 0)
        // Решение системы уравнений дает:
        const cy = -6.306;
        const R = 7.076;

        function getTopY(x) {
            return ridgeY - (ridgeY / halfWidth) * Math.abs(x);
        }
        function getBotY(x) {
            const absX = Math.abs(x);
            if (absX >= strutX) return 0; // Прямой горизонтальный участок 640мм на краях
            return cy + Math.sqrt(R * R - absX * absX);
        }

        const colX = strutX; // Колонны стоят строго под вертикальными стойками фермы (3.21м)
        const colHeight = 3.0; // Высота колонны под авто
        const colExtension = 0.5;
        const totalColHeight = colHeight + colExtension;
        const mainBeamHeight = 0.12;
        const mainBeamWidth = 0.12;

        function createTruss() {
            const trussGroup = new THREE.Group();

            // Центральная стойка
            trussGroup.add(createTube(new THREE.Vector3(0, getTopY(0), 0), new THREE.Vector3(0, getBotY(0), 0), tubeW));

            const numInnerSegments = 4;
            const dx = strutX / numInnerSegments; // шаг узлов на верхнем поясе

            for (let side = -1; side <= 1; side += 2) {
                // Узлы верхнего пояса
                const tNodes = [];
                for (let i = 0; i <= numInnerSegments; i++) {
                    tNodes.push(new THREE.Vector3(side * i * dx, getTopY(side * i * dx), 0));
                }
                tNodes.push(new THREE.Vector3(side * halfWidth, 0, 0)); // Крайняя острая точка

                // Узлы нижнего пояса (Warren truss - узлы по центру между верхними)
                const bNodes = [];
                bNodes.push(new THREE.Vector3(0, getBotY(0), 0)); // Центр
                for (let i = 0; i < numInnerSegments; i++) {
                    const x = side * (i * dx + dx / 2);
                    bNodes.push(new THREE.Vector3(x, getBotY(x), 0));
                }
                bNodes.push(new THREE.Vector3(side * strutX, 0, 0)); // Узел над колонной
                bNodes.push(new THREE.Vector3(side * halfWidth, 0, 0)); // Крайняя острая точка

                // Отрисовка верхнего пояса
                for (let i = 0; i < tNodes.length - 1; i++) {
                    trussGroup.add(createTube(tNodes[i], tNodes[i + 1], tubeW));
                }

                // Отрисовка нижнего пояса
                for (let i = 0; i < bNodes.length - 1; i++) {
                    trussGroup.add(createTube(bNodes[i], bNodes[i + 1], tubeW));
                }

                // Отрисовка зигзагов (раскосов)
                for (let i = 0; i < numInnerSegments; i++) {
                    trussGroup.add(createTube(tNodes[i], bNodes[i + 1], tubeW)); // Вниз-вбок
                    trussGroup.add(createTube(bNodes[i + 1], tNodes[i + 1], tubeW)); // Вверх-вбок
                }

                // Вертикальная стойка на отметке 640мм
                trussGroup.add(createTube(tNodes[numInnerSegments], bNodes[numInnerSegments + 1], tubeW));
            }
            return trussGroup;
        }

        const trussYatCol = getBotY(colX);
        const trussOffsetY = (colHeight + mainBeamHeight) - trussYatCol;

        for (let i = 0; i < numTrusses; i++) {
            const truss = createTruss();
            truss.position.z = -totalLength / 2 + i * spacing;
            truss.position.y = trussOffsetY;
            group.add(truss);
        }

        // Продольные балки (Деталь 9)
        const beamGeo = new THREE.BoxGeometry(mainBeamWidth, mainBeamHeight, totalLength + 0.05);
        const leftBeam = createEdgesMesh(beamGeo);
        leftBeam.position.set(-colX, colHeight + mainBeamHeight / 2, 0);
        group.add(leftBeam);

        const rightBeam = createEdgesMesh(beamGeo);
        rightBeam.position.set(colX, colHeight + mainBeamHeight / 2, 0);
        group.add(rightBeam);

        // Колонны (Детали 7 и 8) и Юбка (Деталь 10)
        const columnGeo = new THREE.BoxGeometry(colW, totalColHeight, colW);
        const baseGeo = new THREE.BoxGeometry(0.2, 0.008, 0.2); // Фланец 200х200х8мм

        // Опоры ставим с выносом (смещаем внутрь от краев балки на 0.6м)
        const colZInset = 0.6;
        const supportZPositions = [-totalLength / 2 + colZInset, 0, totalLength / 2 - colZInset];

        supportZPositions.forEach(z => {
            [-colX, colX].forEach(x => {
                const col = createEdgesMesh(columnGeo);
                col.position.set(x, (colHeight - colExtension) / 2, z);
                group.add(col);

                const base = createEdgesMesh(baseGeo);
                base.position.set(x, 0, z); // Фланец на нулевой отметке
                group.add(base);

                // Укосины (Деталь 6: 80x80x3 L=707.1)
                const pBase = new THREE.Vector3(x, colHeight - 0.5, z);
                const pTop1 = new THREE.Vector3(x, colHeight, z - 0.5);
                const pTop2 = new THREE.Vector3(x, colHeight, z + 0.5);

                const bracketWidth = 0.08;
                // Укосины идут в обе стороны от каждой колонны
                group.add(createTube(pBase, pTop1, bracketWidth));
                group.add(createTube(pBase, pTop2, bracketWidth));
            });
        });

        // Прогоны по крыше (Детали 4 и 5)
        const purlinOverhang = (roofLength - totalLength) / 2;

        // Позиции прогонов строго по узлам верхнего пояса фермы
        const purlinXPositions = [0];
        const numInnerSegmentsPurlins = 4;
        const dxPurlin = strutX / numInnerSegmentsPurlins;
        for (let i = 1; i <= numInnerSegmentsPurlins; i++) {
            purlinXPositions.push(i * dxPurlin);
        }
        purlinXPositions.push(halfWidth);

        purlinXPositions.forEach((x, index) => {
            const purlinSize = 0.04;
            const y = getTopY(x) + trussOffsetY + tubeW / 2 + purlinSize / 2;

            const purGeo = new THREE.BoxGeometry(purlinSize, purlinSize, roofLength);
            const slope = (ridgeY / halfWidth);
            const angle = Math.atan(slope);

            if (index === 0) {
                const p = createEdgesMesh(purGeo);
                p.position.set(0, y, 0);
                group.add(p);
            } else {
                const p1 = createEdgesMesh(purGeo);
                p1.position.set(x, y, 0);
                p1.rotation.z = -angle;
                group.add(p1);

                const p2 = createEdgesMesh(purGeo);
                p2.position.set(-x, y, 0);
                p2.rotation.z = angle;
                group.add(p2);
            }
        });

        // --- Добавление сносок (цифры) ---
        function createCallout(number, target, offset) {
            const start = target.clone();
            const end = target.clone().add(offset);
            const tailDir = end.x > start.x ? 1 : -1;
            const tailLength = 0.8;
            const tailEnd = end.clone().add(new THREE.Vector3(tailDir * tailLength, 0, 0));

            // Линия выноски (с горизонтальной "полкой")
            const points = [start, end, tailEnd];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1, depthTest: false });
            const line = new THREE.Line(geo, mat);
            line.renderOrder = 999;
            group.add(line);

            // Текст (Спрайт высокого разрешения)
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = 'italic 76px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';

            // Белая толстая обводка для читаемости 
            ctx.lineWidth = 10; // чуть толще для лучшего отделения
            ctx.strokeStyle = '#ffffff';
            ctx.strokeText(number.toString(), 64, 124);

            // Черная заливка цифры
            ctx.fillStyle = '#000000';
            ctx.fillText(number.toString(), 64, 124);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            texture.generateMipmaps = true;
            texture.minFilter = THREE.LinearMipmapLinearFilter;

            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);

            const spriteSize = 1.4; // Чуть меньше, чтобы не были огромными, но читались
            sprite.scale.set(spriteSize, spriteSize, 1);

            const shelfCenter = end.clone().add(new THREE.Vector3(tailDir * (tailLength / 2), 0, 0));
            sprite.position.copy(shelfCenter).add(new THREE.Vector3(0, spriteSize / 2, 0));

            sprite.renderOrder = 1000;
            group.add(sprite);
        }

        const zFront = totalLength / 2;
        const zBack = -totalLength / 2;

        // Распределяем сноски по всему объему навеса (разные z, разные стороны, большие вылеты offset)

        // 1 - Нижний пояс фермы (на передней ферме, слева)
        createCallout(1, new THREE.Vector3(-2.0, getBotY(-2.0) + trussOffsetY, zFront), new THREE.Vector3(-3.5, -2.5, 1.0));

        // 4 - Верхние прогоны (на заднем скате, справа)
        createCallout(4, new THREE.Vector3(2.0, getTopY(2.0) + trussOffsetY, zBack + spacing), new THREE.Vector3(3.5, 2.5, -1.0));

        // 5 - Свес прогона (на переднем крае, справа)
        createCallout(5, new THREE.Vector3(halfWidth, getTopY(halfWidth) + trussOffsetY, zFront + purlinOverhang), new THREE.Vector3(3.5, 1.5, 1.0));

        // 6 - Укосина (на центральной левой колонне)
        createCallout(6, new THREE.Vector3(-colX, colHeight - 0.4, 0), new THREE.Vector3(-3.5, -0.5, 0));

        // 7 - Нижняя опора (на задней правой колонне)
        createCallout(7, new THREE.Vector3(colX, -0.25, zBack + colZInset), new THREE.Vector3(3.5, -0.5, -1.0));

        // 8 - Основная колонна (на передней левой колонне)
        createCallout(8, new THREE.Vector3(-colX, colHeight / 2, zFront - colZInset), new THREE.Vector3(-4.0, 0.5, 1.0));

        // 9 - Несущая балка (в зоне переднего выноса)
        createCallout(9, new THREE.Vector3(colX, colHeight + mainBeamHeight / 2, zFront - 0.3), new THREE.Vector3(4.0, -1.0, 0));

        // 10 - Фланец (на передней правой колонне)
        createCallout(10, new THREE.Vector3(colX, 0, zFront - colZInset), new THREE.Vector3(3.5, -1.5, 1.0));

        // Центрируем
        group.position.y = -1;
        scene.add(group);

        function render() { renderer.render(scene, camera); }
        render();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            render();
        });

        // Вращение мышью
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        document.addEventListener('mousedown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        document.addEventListener('mouseup', () => { isDragging = false; });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                group.rotation.y += (e.clientX - prevMouse.x) * 0.01;
                render();
            }
            prevMouse = { x: e.clientX, y: e.clientY };
        });

        // Зумирование колесиком мыши
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            // Плавный зум
            camera.zoom *= Math.pow(0.999, e.deltaY);
            // Ограничения зума
            camera.zoom = Math.max(0.5, Math.min(10.0, camera.zoom));
            camera.updateProjectionMatrix();
            render();
        }, { passive: false });
    </script>
</body>

</html>
